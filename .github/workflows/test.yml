name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            package_manager: apt
            package_format: deb
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            package_manager: apt
            package_format: deb
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            package_manager: apt
            package_format: deb
          - name: Debian 12
            image: debian:12
            package_manager: apt
            package_format: deb
          - name: Debian 13
            image: debian:13
            package_manager: apt
            package_format: deb
          - name: Fedora 43
            image: fedora:43
            package_manager: dnf
            package_format: rpm
          - name: Fedora 44
            image: fedora:44
            package_manager: dnf
            package_format: rpm
          - name: AlmaLinux 9
            image: almalinux:9
            package_manager: dnf
            package_format: rpm
          - name: AlmaLinux 10
            image: almalinux:10
            package_manager: dnf
            package_format: rpm
          - name: Arch Linux
            image: archlinux:latest
            package_manager: pacman
            package_format: none

    steps:
      - name: Install test dependencies
        shell: sh
        run: |
          case "${{ matrix.package_manager }}" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                bash \
                ca-certificates \
                dpkg-dev \
                git \
                python3
              ;;
            dnf)
              dnf install -y \
                bash \
                ca-certificates \
                git \
                python3 \
                rpm-build
              ;;
            pacman)
              pacman -Syu --noconfirm \
                bash \
                ca-certificates \
                git \
                python
              ;;
            *)
              echo "Unsupported package manager" >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show test environment
        shell: bash
        run: |
          cat /etc/os-release
          python3 --version
          bash --version | head -n 1

      - name: Check Python version
        shell: bash
        run: |
          python3 -c \
            'import sys; assert sys.version_info >= (3, 9), sys.version'

      - name: Run unit tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Check shell syntax
        shell: bash
        run: |
          bash -n \
            install.sh \
            uninstall.sh \
            bin/* \
            script/*.sh \
            packaging/*.sh \
            *.config

      - name: Build native package
        shell: bash
        run: |
          case "${{ matrix.package_format }}" in
            deb)
              ./packaging/build-deb.sh
              dpkg-deb --info dist/*.deb
              dpkg-deb --contents dist/*.deb
              ;;
            rpm)
              ./packaging/build-rpm.sh
              rpm -qpl dist/*.noarch.rpm
              ;;
            none)
              echo "No DEB or RPM package for this distribution"
              ;;
          esac

      - name: Test native package lifecycle
        shell: bash
        run: |
          case "${{ matrix.package_format }}" in
            deb)
              apt-get install -y ./dist/*.deb
              dpkg-query --show brscan-skey-enhanced
              brscan-skey-config --help
              apt-get remove -y brscan-skey-enhanced
              ;;
            rpm)
              dnf install -y ./dist/*.noarch.rpm
              rpm -q brscan-skey-enhanced
              brscan-skey-config --help
              dnf remove -y brscan-skey-enhanced
              ;;
            none)
              echo "No package lifecycle test for this distribution"
              ;;
          esac
          test ! -e /usr/bin/brscan-skey-config
          test ! -e /usr/lib/brscan-skey-enhanced
